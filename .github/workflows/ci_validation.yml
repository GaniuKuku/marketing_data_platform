name: Continuous Integration Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'models/**'
      - 'tests/**'
      - 'dbt_project.yml'
      - 'packages.yml'
      - '.github/workflows/**'

jobs:
  dbt_ci_run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install dbt-databricks elementary-data
          dbt deps

      - name: Run CI Build & Test
        env:
          DBT_PROFILES_DIR: .
          CI_CATALOG: ${{ vars.CI_CATALOG }}
          CI_SCHEMA: ${{ vars.CI_SCHEMA }}
          CI_HOST: ${{ vars.CI_HOST }}
          CI_HTTP_PATH: ${{ vars.CI_HTTP_PATH }}
          CI_CLIENT_ID: ${{ secrets.DB_CI_CLIENT_ID }}
          CI_CLIENT_SECRET: ${{ secrets.DB_CI_CLIENT_SECRET }}
        run: |
          dbt run --exclude elementary --target ci
          dbt build --target ci