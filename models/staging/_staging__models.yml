version: 2

models:
  - name: stg_facebook_ads
    description: >
      Cleaned and standardized daily ad performance data from Facebook Ads.
      Grain: One row per ad (ad_id) per platform ('facebook') per day (date_day).
    columns:
      - name: ad_daily_id
        description: "Surrogate primary key generated from platform, ad_id, and date_day."
        tests:
          - unique
          - not_null
      - name: date_day
        description: "The calendar date of the advertising performance record."
        tests:
          - not_null
      - name: platform
        description: "Normalized advertising platform identifier ('facebook')."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['facebook', 'snapchat']
      - name: campaign_id
        description: "Platform-specific identifier for the marketing campaign."
        tests:
          - not_null
      - name: ad_id
        description: "Platform-specific identifier for the individual ad creative."
        tests:
          - not_null
      - name: spend
        description: "Total advertising spend for the ad on the given day."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: impressions
        description: "Total number of times the ad was displayed on the given day."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: clicks
        description: "Total number of clicks generated by the ad on the given day."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: stg_snapchat_ads
    description: >
      Cleaned and standardized daily ad performance data from Snapchat Ads.
      Grain: One row per ad (ad_id) per platform ('snapchat') per day (date_day).
    columns:
